<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Google Font */
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

#container{
    width:100%;
    max-width:1400px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:30px;
}

.box{
    position:relative;
    padding:30px 25px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    overflow:hidden;
    transition:.4s ease;
    cursor:pointer;
    box-shadow:0 15px 35px rgba(0,0,0,.3);
}

.box::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    background:linear-gradient(45deg,#00dbde,#fc00ff);
    border-radius:50%;
    top:-90px;
    right:-90px;
    opacity:.35;
    transition:.5s;
}

.box:hover::before{
    transform:scale(1.6);
}

.box:hover{
    transform:translateY(-12px) scale(1.03);
    box-shadow:0 25px 45px rgba(0,0,0,.45);
}

.box h1{
    color:#fff;
    font-size:28px;
    margin-bottom:20px;
    position:relative;
    z-index:1;
}

.box h2{
    color:#e6e6e6;
    font-size:18px;
    margin:12px 0;
    font-weight:500;
    position:relative;
    z-index:1;
}

.box h2:nth-child(2){
    color:#00ffb3;
    font-weight:700;
}

.box h2:nth-child(3){
    display:inline-block;
    background:#ffffff20;
    padding:8px 18px;
    border-radius:30px;
    border:1px solid rgba(255,255,255,.2);
    color:#fff;
}

@media(max-width:768px){
    body{
        padding:20px;
    }

    .box{
        padding:25px;
    }

    .box h1{
        font-size:24px;
    }

    .box h2{
        font-size:16px;
    }
}

    </style>
</head>
<body>
    <div class="container" id="container">
        
    </div>

    <script>
        let html="";
     fetch("today.json")
     .then(data =>data.json())
     .then(data =>{
        for(let i in data){
              html+=`
               <div class="box">
           <h1>${data[i].name}</h1>
           <h2>${data[i].price}</h2>
           <h2>${data[i].color}</h2>
        </div>      
              
              
              `
              document.getElementById("container").innerHTML=html
        }
     })
    </script>
</body>
</html>
